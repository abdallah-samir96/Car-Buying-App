services:
  postgres:
    image: postgres:16
    container_name: car-buying-postgres
    environment:
      POSTGRES_DB: car_buying
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_buying"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-buying-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/car_buying
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

volumes:
  postgres_data:
